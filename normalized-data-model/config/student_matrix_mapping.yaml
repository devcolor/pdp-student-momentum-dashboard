# How the student matrix enrichment file writes its values, and where each column goes.
# Run on every load. What a valid stored value looks like (types, allowed values, ranges) is NOT
# here: it's in config/destination_schema.yaml, the same for every file that writes the column.
#
# One row per student per fall term, into student_term_matrix. See the field notes in
# on_campus_housing_mapping.yaml.
# Written by src/generator/enrichment/student_matrix.py.

- source: Student_GUID
  destination_table: student_term_matrix
  destination_column: student_id
  on_conflict: replace

- source: Academic_Year
  destination_table: term
  destination_column: academic_year
  on_conflict: replace

- source: Academic_Term
  destination_table: term
  destination_column: academic_term
  on_conflict: replace

