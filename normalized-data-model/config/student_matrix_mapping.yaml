  on_conflict: replace

- source: Student_Level
  destination_table: student_term_matrix
  destination_column: student_level
  on_conflict: replace

- source: Degree_Seeking
  destination_table: student_term_matrix
  destination_column: degree_seeking
  true_values: ['true']
  false_values: ['false']
  on_conflict: replace

- source: Full_Time
  destination_table: student_term_matrix
  destination_column: full_time
  true_values: ['true']
  false_values: ['false']
