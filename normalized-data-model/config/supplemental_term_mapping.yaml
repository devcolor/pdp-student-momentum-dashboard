# How an uploaded supplemental file with a term writes its values, and where each column goes.
# Run on every load that includes one. What a valid stored value looks like is NOT here: it's in
# config/destination_schema.yaml, the same for every file that writes the column.
#
# The same as supplemental_mapping.yaml, plus the term each fact belongs to, the way
# on_campus_housing_mapping.yaml ties housing to a term.

- source: Student_GUID
  destination_table: student_attribute
  destination_column: student_id
  on_conflict: replace

- source: Academic_Year
  destination_table: term
  destination_column: academic_year
  on_conflict: replace

- source: Academic_Term
  destination_table: term
  destination_column: academic_term
  on_conflict: replace

- source: Attribute_Key
  destination_table: student_attribute
  destination_column: attribute_key
  on_conflict: replace

- source: Attribute_Value
  destination_table: student_attribute
  destination_column: attribute_value
  on_conflict: replace

- source: Source
  destination_table: student_attribute
  destination_column: source
  on_conflict: replace
